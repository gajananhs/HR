<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16302C">
  <title>Offline · Quickair HR</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:#EDEAE2;color:#1D2B26;font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    .card{max-width:380px;width:100%;background:#fff;border:1px solid #E9E5D8;border-radius:24px;padding:32px 26px;text-align:center;
      box-shadow:0 24px 60px rgba(22,48,44,.14)}
    img{width:64px;height:64px;border-radius:16px;margin-bottom:18px}
    h1{font-family:Fraunces,Georgia,serif;font-size:22px;margin-bottom:8px}
    p{font-size:13.5px;color:#5f776a;line-height:1.6;margin-bottom:22px}
    button{width:100%;background:#16302C;color:#FAF7F0;border:none;border-radius:12px;padding:13px;font:600 14px inherit;cursor:pointer}
    button:focus-visible{outline:2px solid #D9A22C;outline-offset:2px}
  </style>
</head>
<body>
  <main class="card">
    <img src="icons/icon-192.png" alt="" width="64" height="64">
    <h1>You’re offline</h1>
    <p>Quickair HR couldn’t reach the network and this page isn’t saved on your device yet. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function(){ location.reload(); });</script>
</body>
</html>
